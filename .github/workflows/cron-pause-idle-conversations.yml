# Companion to cron-reminders.yml -- see that file's header for why this
# exists (Vercel serverless can't run src/reminders/scheduler.py's own
# in-process CronTrigger). Fires once daily at 22:00 Asia/Bangkok, which is
# 15:00 UTC (GitHub Actions `cron:` schedules are always UTC).
#
# Requires the same two repo secrets as cron-reminders.yml: CHATBOT_URL,
# CRON_SECRET.
#
# `schedule:` is disabled -- production scheduling moved to cron-job.org,
# which hits the same /internal/cron/pause-idle-conversations endpoint with
# the same Authorization: Bearer CRON_SECRET header. Kept as
# workflow_dispatch only so it's still available to run by hand if ever
# needed.
name: Trigger daily idle-conversation pause

on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/cron/pause-idle-conversations
        run: |
          curl -sf -X GET "${{ secrets.CHATBOT_URL }}/internal/cron/pause-idle-conversations" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
