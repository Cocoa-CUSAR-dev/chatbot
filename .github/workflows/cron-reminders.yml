# Manually triggers the reminder check from OUTSIDE the process -- needed
# because this service is deployed to Vercel, where a serverless function is
# frozen between requests and can never run its own in-process scheduler
# (src/reminders/scheduler.py) on time. See src/internal/router.py's
# docstring for the full story.
#
# `schedule:` is disabled -- production scheduling moved to cron-job.org,
# which hits the same /internal/cron/reminders endpoint with the same
# Authorization: Bearer CRON_SECRET header. Kept as workflow_dispatch only
# so it's still available to run by hand if ever needed.
#
# Requires two repo secrets (Settings > Secrets and variables > Actions),
# used only when this workflow is run by hand:
#   CHATBOT_URL   -- the deployed base URL, e.g. https://<project>.vercel.app
#   CRON_SECRET   -- must match the CRON_SECRET env var set on the Vercel
#                    project itself (src/internal/config.py)
#
# Not needed at all if this service is ever moved to a persistent host
# (Render, a VM, ...) -- there, scheduler.py's own scheduling just works and
# neither this workflow nor cron-job.org is required.
name: Trigger reminder check

on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/cron/reminders
        run: |
          curl -sf -X GET "${{ secrets.CHATBOT_URL }}/internal/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
