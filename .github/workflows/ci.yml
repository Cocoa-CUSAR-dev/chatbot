name: CI

# Runs on every push, not just PRs, and the test job always runs the FULL
# suite under tests/ -- not path-filtered, not limited to what changed.
on:
  push:
    branches: '**'
  pull_request:
    branches: '**'


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # Most tests don't hit a real DB/LINE/LLM, they only need Settings()
      # to construct without error at import time -- but DATABASE_URL now
      # points at the real Postgres service above, since DB-backed
      # integration tests (see tests/resources/schema.sql) use it directly.
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/chatbot_test
      KOTLIN_BACKEND_URL: http://localhost:3001/api/v1
      GO_BACKEND_URL: http://localhost:8080
      LINE_CHANNEL_SECRET: test-secret
      LINE_CHANNEL_ACCESS_TOKEN: test-token
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U test; do
            echo "waiting for postgres..."; sleep 2;
          done
      - name: Initialize test schema
        run: |
          PGPASSWORD=test psql -h localhost -U test -d chatbot_test \
            -f tests/resources/schema.sql
      - run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cocoa-chatbot:${{ github.sha }} .
