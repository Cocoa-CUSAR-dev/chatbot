[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cocoa-chatbot"
version = "0.1.0"
description = "LINE OA AI chatbot service for the Cocoa Supply Chain Databank (Is Thai Cacao)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "line-bot-sdk>=3.14",
    "litellm>=1.52",
    "apscheduler>=3.10",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "sentry-sdk[fastapi]>=2.17",
    # src/conversation/text_parsing.py: thaiword_to_num (spelled-out Thai
    # numerals -> int) and dateparser (Thai relative/absolute dates).
    "pythainlp>=5.0",
    "dateparser>=1.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true
# SQLAlchemy's async engine runs every DB call through greenlet; without
# this, coverage stops tracing a coroutine after it awaits the database and
# reports lines that clearly ran (the webhook handlers) as missed.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# docs-and-plan#247 took src/ from 91% to 96% with the DB tests included.
# The floor sits just under that so a change that drops tests fails CI,
# without a one-line refactor tripping it. Only meaningful where the DB
# tests run (CI): a local run without RUN_DB_TESTS skips them and lands
# far lower.
fail_under = 94

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
